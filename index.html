<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospecting Tracker PRO - $125 Lifetime</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--gold:#D4A843;--dark:#121212;--card:#1e1e1e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:var(--dark);color:white}
header{background:black;border-bottom:2px solid var(--gold);padding:12px;display:flex;justify-content:space-between;align-items:center}
header h1{color:var(--gold);font-size:18px;letter-spacing:1px}
.badge{background:var(--gold);color:black;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:bold}
.offline{background:#222;border:1px solid var(--gold);margin:10px;padding:10px;border-radius:8px;color:var(--gold);font-size:12px;text-align:center}
#map{height:380px;width:100%;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.controls{padding:12px;background:var(--card);margin:10px;border-radius:10px;border:1px solid #333}
.controls h3{color:var(--gold);font-size:12px;margin-bottom:8px}
select,input,textarea,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #444;background:#111;color:white}
button{background:var(--gold);color:black;font-weight:bold;border:none;cursor:pointer;font-size:14px}
button:active{transform:scale(0.98)}
.log-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px}
.rock-card{background:var(--card);border:1px solid #333;border-radius:6px;padding:6px;font-size:10px}
.rock-card img{width:100%;height:70px;object-fit:cover;border-radius:4px}
.stats{display:flex;justify-content:space-around;background:var(--card);margin:10px;padding:10px;border-radius:8px;border:1px solid var(--gold);font-size:11px}
.buy{margin:20px;background:linear-gradient(90deg,var(--gold),#a87d1f);color:black;padding:15px;text-align:center;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>⛏️ PROSPECTING TRACKER PRO</h1>
<span class="badge">OFFLINE READY</span>
</header>
<div class="offline">⚡ OFFLINE MODE • Changes will sync when back online • GPS Active</div>
<div id="map"></div>

<div class="controls">
<h3>➕ NEW ENTRY</h3>
<select id="soil">
<option>Sandy Loam - Karoo</option>
<option>Red Soil - Indicator</option>
<option>Clay</option>
<option>Calcrete</option>
<option>River Gravel</option>
<option>Kimberlite Pipe Area</option>
</select>
<select id="status">
<option value="confirmed">✅ CONFIRMED Find</option>
<option value="possible">⚠️ POSSIBLE</option>
<option value="high">🔴 HIGH PRIORITY</option>
</select>
<input type="text" id="rockname" placeholder="Rock # - e.g. Hematite 1.2kg">
<input type="file" id="photo" accept="image/*">
<textarea id="notes" placeholder="Notes: Garnets? Ilmenite? Near river?"></textarea>
<button onclick="saveEntry()">+ SAVE ENTRY - GPS + PHOTO</button>
</div>

<div class="stats">
<span style="color:#2ecc71">● Confirmed: <b id="cCount">0</b></span>
<span style="color:#f1c40f">● Possible: <b id="pCount">0</b></span>
<span style="color:#e74c3c">● High: <b id="hCount">0</b></span>
</div>

<div class="controls"><h3>📸 PHOTO LOG - ROCKS</h3><div class="log-grid" id="logGrid"></div></div>

<div class="buy">
PRO VERSION - $125 ONCE-OFF<br>
<span style="font-size:12px">Lifetime • No monthly fee • Works offline in bush</span><br><br>
<a href="https://payhip.com/b/0ybhq" style="color:black;text-decoration:underline">Buy Now → payhip.com/b/0ybhq</a>
</div>

<script>
let map = L.map('map').setView([-26.2041,28.0473], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
navigator.geolocation.getCurrentPosition(p=>{
  let lat=p.coords.latitude, lng=p.coords.longitude;
  map.setView([lat,lng],14);
  L.marker([lat,lng]).addTo(map).bindPopup("You • "+lat.toFixed(4)+", "+lng.toFixed(4)).openPopup();
});
let entries = JSON.parse(localStorage.getItem('prospectEntries')||'[]');
function render(){
  document.getElementById('logGrid').innerHTML='';
  let c=0,p=0,h=0;
  entries.forEach((e)=>{
    if(e.status==='confirmed')c++; if(e.status==='possible')p++; if(e.status==='high')h++;
    let div=document.createElement('div'); div.className='rock-card';
    div.innerHTML=`<img src="${e.img||'https://via.placeholder.com/100'}"><br>${e.name}<br><small>${e.soil}</small><br><small>${e.date}</small>`;
    document.getElementById('logGrid').appendChild(div);
    if(e.lat) L.marker([e.lat,e.lng],{icon: L.divIcon({html:`<div style="background:${e.status==='confirmed'?'#2ecc71':e.status==='possible'?'#f1c40f':'#e74c3c'};width:12px;height:12px;border-radius:50%;border:2px solid white"></div>`})}).addTo(map);
  });
  document.getElementById('cCount').textContent=c; document.getElementById('pCount').textContent=p; document.getElementById('hCount').textContent=h;
}
function saveEntry(){
  let soil=document.getElementById('soil').value; let status=document.getElementById('status').value;
  let name=document.getElementById('rockname').value||'Rock #'+(entries.length+1);
  let file=document.getElementById('photo').files[0]; let notes=document.getElementById('notes').value;
  navigator.geolocation.getCurrentPosition(pos=>{
    let lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(file){let r=new FileReader(); r.onload=e=>{entries.push({soil,status,name,img:e.target.result,lat,lng,date:new Date().toLocaleDateString(),notes}); localStorage.setItem('prospectEntries',JSON.stringify(entries)); render(); alert('Saved! GPS: '+lat.toFixed(4)+','+lng.toFixed(4));}; r.readAsDataURL(file);}
    else {entries.push({soil,status,name,img:'',lat,lng,date:new Date().toLocaleDateString(),notes}); localStorage.setItem('prospectEntries',JSON.stringify(entries)); render(); alert('Saved! GPS: '+lat.toFixed(4)+','+lng.toFixed(4));}
  },()=>{alert('Allow GPS to save location!')});
}
render();
</script>
</body>
</html>
