<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospecting Tracker PRO - $125 Lifetime Worldwide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--gold:#D4A843;--dark:#121212;--card:#1e1e1e}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{background:var(--dark);color:white}
    header{
      background:black;
      border-bottom:2px solid var(--gold);
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center
    }
    header h1{color:var(--gold);font-size:18px;letter-spacing:1px}
    .badge{
      background:var(--gold);
      color:black;
      padding:4px 8px;
      border-radius:12px;
      font-size:10px;
      font-weight:bold
    }
    .offline{
      background:#222;
      border:1px solid var(--gold);
      margin:10px;
      padding:10px;
      border-radius:8px;
      color:var(--gold);
      font-size:12px;
      text-align:center
    }
    #map{
      height:380px;
      width:100%;
      border-top:2px solid var(--gold);
      border-bottom:2px solid var(--gold)
    }
    .controls{
      padding:12px;
      background:var(--card);
      margin:10px;
      border-radius:10px;
      border:1px solid #333
    }
    .controls h3{
      color:var(--gold);
      font-size:12px;
      margin-bottom:8px
    }
    select,input,textarea,button{
      width:100%;
      padding:10px;
      margin:6px 0;
      border-radius:6px;
      border:1px solid #444;
      background:#111;
      color:white
    }
    button{
      background:var(--gold);
      color:black;
      font-weight:bold;
      border:none;
      cursor:pointer;
      font-size:14px
    }
    button:active{transform:scale(0.98)}
    .log-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:10px
    }
    .rock-card{
      background:var(--card);
      border:1px solid #333;
      border-radius:6px;
      padding:6px;
      font-size:10px
    }
    .rock-card img{
      width:100%;
      height:70px;
      object-fit:cover;
      border-radius:4px
    }
    .stats{
      display:flex;
      justify-content:space-around;
      background:var(--card);
      margin:10px;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--gold);
      font-size:11px
    }
    .buy{
      margin:20px;
      background:linear-gradient(90deg,var(--gold),#a87d1f);
      color:black;
      padding:18px;
      text-align:center;
      border-radius:12px;
      font-weight:bold
    }
    .buy a{
      color:black;
      background:white;
      padding:10px 20px;
      border-radius:25px;
      text-decoration:none;
      display:inline-block;
      margin-top:10px;
      font-size:16px;
    }
    .treasure-box{
      background:#2a2210;
      border:1px dashed var(--gold);
      padding:8px;
      border-radius:8px;
      margin:6px 0;
      font-size:11px;
      color:#D4A843;
    }
  </style>
</head>
<body>

<header>
  <h1>⛏️ PROSPECTING TRACKER PRO</h1>
  <span class="badge">WORLDWIDE $125</span>
</header>

<div class="offline">
  ⚡ OFFLINE MODE • Works Worldwide: USA • Australia • SA • UK • No Signal Needed<br>
  🪙 COIN + METALS + BURIED TREASURE MODE ACTIVE • GPS Active
</div>

<div id="map"></div>

<div class="controls">

  <select id="category">
    <option value="treasure">🏴‍☠️ BURIED TREASURE - Old History / Hoard / Cache</option>
    <option value="coin">🪙 COINS - Old Coins / Silver / Gold Coins / Colonial</option>
    <option value="metal">🔩 METALS - Copper / Silver / Iron / Relics</option>
    <option value="gold">🥇 GOLD - Nugget / Alluvial / Vein</option>
    <option value="diamond">💎 DIAMONDS - Kimberlite / Alluvial</option>
    <option value="relic">⚔️ RELIC - War / Farm / Old House Site</option>
    <option value="gem">💍 GEMS - Garnet / Emerald / Ruby</option>
    <option value="meteorite">☄️ METEORITE - Iron / Stony</option>
  </select>

  <select id="soil">
    <option>Old House Foundation - Treasure Hoard</option>
    <option>Farm Field - Coins / Relics</option>
    <option>Beach Sand - Shipwreck Coins</option>
    <option>River Crossing - Lost Coins</option>
    <option>Old Church / Mission
